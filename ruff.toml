# CI lint gate (SOC 2 CC8.1). Scope is deliberately narrow, matching cc-ai's
# ruff.toml: the goal is a green control, not a rewrite of the service.
#
# The lint job is **blocking** as of the PR that fixed the findings below. It was
# non-blocking when this file was introduced, because `ruff check .` reported nine
# real defects: eight parse errors in vehicle_rates_vector.py and an undefined
# `coverage_c` in home_insurance.py. Those are fixed, `ruff check .` passes clean,
# and the job blocks. Do not demote it back to reach green -- fix the finding.

[lint]
select = ["E4", "E7", "E9", "F"]

# Style and hygiene codes only, ignored wholesale so the control landed without a
# cleanup mixed into it. ~727 findings, all cosmetic:
#
#   F401 / F541 / F811 / F841 / E401 / E402 / E701 / E703 / E721 / E741
#   E702  15x  semicolon-separated statements, all in
#              app/services/vehicle_search/ai_assistant_service_gemini_sdk.py.
#
# Nothing here masks a defect: E9 (syntax) and F821 (undefined name) are both
# live, and both are what caught the nine. Clearing these is worthwhile; adding
# to the list to silence a new finding is not.
ignore = [
    "F401", # unused-import
    "F541", # f-string-missing-placeholders
    "F811", # redefined-while-unused
    "F841", # unused-variable
    "E401", # multiple-imports-on-one-line
    "E402", # module-import-not-at-top-of-file
    "E701", # multiple-statements-on-one-line-colon
    "E702", # multiple-statements-on-one-line-semicolon
    "E703", # useless-semicolon
    "E721", # type-comparison
    "E741", # ambiguous-variable-name
]
